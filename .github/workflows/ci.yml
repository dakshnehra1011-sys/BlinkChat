name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Lint, Typecheck, Test (>90% Coverage) & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Biome Linter Check
        run: bun run lint

      - name: Prettier Format Check
        run: bun run format:check

      - name: TypeScript Typecheck
        run: bun run typecheck

      - name: Vitest Suite (>90% Coverage Enforcement)
        run: bun run test:coverage

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Prepare local Worker for real WebRTC E2E
        shell: bash
        run: |
          printf 'JWT_SIGNING_SECRET=%s\nENVIRONMENT=development\n' 'blinkchat-ci-only-jwt-secret-32-characters-minimum' > apps/worker/.dev.vars
          bun run db:migrate:local

      - name: Browser End-to-End Tests
        run: bun run test:e2e

      - name: Build Web Application
        run: bun --filter @blinkchat/web build

      - name: Build Cloudflare Worker
        run: bun --filter @blinkchat/worker build

  deploy:
    name: Deploy to Cloudflare Workers & Pages
    needs: validate
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Apply pending Drizzle D1 migrations
        run: bun run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Worker & Durable Objects
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/worker'
          command: 'deploy'

      - name: Build & Deploy Frontend to Cloudflare Pages
        run: |
          bun --filter @blinkchat/web build
          bun run --cwd apps/worker wrangler pages deploy ../web/dist --project-name=blinkchat-web --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_URL: https://blinkchat-worker.blinkchat.workers.dev
